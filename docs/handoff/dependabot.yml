version: 2

# به‌روزرسانی خودکار وابستگی‌ها.
# هر PR فقط یک گروه را عوض می‌کند تا اگر چیزی شکست، مقصر مشخص باشد.
updates:
  - package-ecosystem: npm
    directory: /back
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: 'deps(back)'
    groups:
      # patch/minor با هم، تا تعداد PR کم شود
      back-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # ارتقای major باید دستی و با آزمون انجام شود، نه خودکار
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: 'deps(front)'
    groups:
      front-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # خودِ اکشن‌های CI هم کهنه می‌شوند
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
