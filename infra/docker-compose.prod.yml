# =============================================================================
# Overlay تولید (روی docker-compose.yml سوار می‌شود)
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# تغییرهای نسبت به نسخهٔ قبلی:
#  • MySQL و Redis فقط روی 127.0.0.1 باز می‌شوند (قبلاً روی همهٔ اینترفیس‌ها)
#  • healthcheck برای backend روی /api/health
#  • محدودیت حجم لاگ برای همهٔ سرویس‌ها (جلوگیری از پر شدن دیسک)
#  • UPLOAD_DIR صریح + پورت uploads قابل تنظیم با متغیر
#
# ⚠️ پورت‌های بیرونی تغییر نکرده‌اند: 3000 (backend)، 3307 (mysql)، 6381 (redis).
# =============================================================================
services:

  mysql:
    container_name: monshim_mysql_prod
    ports:
      # فقط از خود سرور قابل دسترسی است (برای mysqldump و دیباگ).
      # قبل از این مستند، روی 0.0.0.0 باز بود یعنی از اینترنت هم.
      - "127.0.0.1:3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"


  redis:
    container_name: monshim_redis_prod
    # Session revocations must survive Redis restarts.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6381:6379"

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"


  backend:
    container_name: monshim_backend_prod

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      NODE_ENV: production
      PORT: 3000

      # مسیر مطلق؛ دیگر به cwd وابسته نیست.
      UPLOAD_DIR: /backend/uploads

    volumes:
      # ✅ فایل‌های آپلودی به Docker وابسته نیستند: این فقط یک «اتصال» است.
      #    مسیر واقعی روی خود سرور است و بیرون از ایمیج زندگی می‌کند.
      #
      # چرا مهم است؟
      #   • اگر این volume نبود، هر بار بازسازی ایمیج → همهٔ عکس‌ها پاک می‌شد
      #   • با volume، فایل‌ها روی دیسک سرور می‌مانند و فقط داخل کانتینر دیده می‌شوند
      #
      # ✅ برای مستقل کردن کامل از کانتینر، مسیر absolute بدهید:
      #      UPLOADS_HOST_PATH=/var/lib/monshim/uploads
      #    در این حالت حتی ایمیج را پاک و از نو بسازید، فایل‌ها سالم می‌مانند.
      #
      # پیش‌فرض نسبی است (`./uploads` کنار همین فایل compose) تا deploy فعلی
      # دست‌نخورده بماند — ولی اگر این فایل به `infra/` منتقل شود، این مسیر
      # عوض می‌شود و فایل‌های موجود پیدا نمی‌شوند. بنابراین قبل از جابه‌جایی
      # ساختار، این متغیر را در `.env` صریح کنید.
      - ${UPLOADS_HOST_PATH:-./uploads}:/backend/uploads

    # `backend` (بعد از اصلاح dockerfile) با `/api/health` بررسی می‌شود.
    # attention: healthcheck در ایمیج `wget` می‌خواهد که در node:22-alpine هست.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
